services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5432:5432"
    volumes:
      - wallet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/wallet
      DATABASE_USER: wallet
      DATABASE_PASSWORD: wallet
      AUTH_TOKENS: dev-token-alice:alice,dev-token-bob:bob,dev-token-carol:carol,dev-token-dave:dave,dev-token-erin:erin
    depends_on:
      db:
        condition: service_healthy

volumes:
  wallet_pg_data:
